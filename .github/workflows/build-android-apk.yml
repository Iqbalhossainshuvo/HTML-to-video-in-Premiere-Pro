name: Build Android app

on:
  push:
    branches: [main, 'claude/**']
    paths: ['mobile/**', 'js/**', '.github/workflows/build-android-apk.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the APK to the release with this tag (e.g. v1.1.0); leave empty to only build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Check (runtime in sync, types, lint)
        run: |
          node scripts/sync-runtime.js
          git diff --exit-code -- src/runtime/generated.ts
          npx tsc --noEmit
          npx expo lint

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk ../HTMLtoVideo-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HTMLtoVideo-android
          path: HTMLtoVideo-Android.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: HTMLtoVideo-Android.apk
