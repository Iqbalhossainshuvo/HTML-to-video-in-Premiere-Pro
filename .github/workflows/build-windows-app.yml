name: Build Windows app

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v1.0.0); leave empty to only build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: npm ci

      - name: Build HTMLtoVideo.exe
        run: npm run build:exe

      - name: Smoke test (render an MP4 with the .exe and Chrome)
        run: node tools/smoke-app.js dist/HTMLtoVideo.exe

      - name: Package the Premiere Pro / After Effects plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force plugin/HTMLtoVideo | Out-Null
          Copy-Item -Recurse CSXS, css, js, jsx, scripts, examples, index.html, .debug, README.md, LICENSE plugin/HTMLtoVideo
          Compress-Archive -Path plugin/HTMLtoVideo -DestinationPath dist/HTMLtoVideo-Plugin.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: HTMLtoVideo-windows
          path: |
            dist/HTMLtoVideo.exe
            dist/HTMLtoVideo-Plugin.zip
            skill/html-to-video.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: HTML to Video ${{ inputs.release_tag || github.ref_name }}
          body: |
            **HTMLtoVideo-Android.apk**: Android app (added a few minutes after the other files). Open it on the phone to install.
            **HTMLtoVideo.exe**: Windows desktop app. Open an HTML file, render it to MP4, watch it in the player, ⬇ save to a folder. Needs Chrome or Edge. Unsigned: if Windows warns, click *More info → Run anyway*.
            **HTMLtoVideo-Plugin.zip**: Premiere Pro / After Effects plugin (every object on its own track/layer, editable keyframes). Unzip, run `scripts/install-win.bat` or `scripts/install-mac.sh`.
            **html-to-video.zip**: Claude skill for writing HTML animations that convert cleanly.

            বাংলা নির্দেশিকা: README.bn.md
          files: |
            dist/HTMLtoVideo.exe
            dist/HTMLtoVideo-Plugin.zip
            skill/html-to-video.zip
