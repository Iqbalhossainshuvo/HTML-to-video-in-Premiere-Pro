<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HTML to Video demo</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(135deg, #0f2027, #203a43 50%, #2c5364);
    font-family: Arial, Helvetica, sans-serif; color: #fff; overflow: hidden;
  }
  .stage { position: relative; width: 100%; height: 100%; }
  .card {
    position: absolute; left: 50%; top: 50%; width: 60%; height: 55%;
    transform: translate(-50%, -50%); border-radius: 28px;
    background: rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.35);
  }
  h1 {
    position: absolute; top: 20%; width: 100%; margin: 0; text-align: center;
    font-size: 96px; letter-spacing: 2px;
    animation: drop 1s cubic-bezier(.2,1.4,.4,1) .2s both;
  }
  p.sub {
    position: absolute; top: 36%; width: 100%; margin: 0; text-align: center;
    font-size: 40px; opacity: .85; animation: fade 1s ease 1s both;
  }
  .icons { position: absolute; top: 55%; width: 100%; display: flex; justify-content: center; gap: 80px; }
  .icons svg { width: 140px; height: 140px; animation: pop .6s ease both; }
  .icons svg:nth-child(1) { animation-delay: 1.6s; }
  .icons svg:nth-child(2) { animation-delay: 1.9s; }
  .icons svg:nth-child(3) { animation-delay: 2.2s; }
  .ball {
    position: absolute; left: 5%; bottom: 8%; width: 90px; height: 90px; border-radius: 50%;
    background: #ffcc00;
  }
  #counter { position: absolute; right: 4%; top: 4%; font-size: 48px; font-weight: bold; }
  @keyframes drop { from { transform: translateY(-300px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes fade { from { opacity: 0 } to { opacity: .85 } }
  @keyframes pop  { from { transform: scale(0) rotate(-90deg) } to { transform: none } }
</style>
</head>
<body>
<div class="stage">
  <div class="card"></div>
  <h1>Hello Premiere</h1>
  <p class="sub">Every object becomes its own track</p>
  <div class="icons">
    <svg viewBox="0 0 24 24"><path fill="#ff5c7c" d="M12 21s-7-4.4-9.5-9C.8 8.6 3 5 6.5 5c2 0 3.5 1.2 5.5 3 2-1.8 3.5-3 5.5-3C21 5 23.2 8.6 21.5 12 19 16.6 12 21 12 21z"/></svg>
    <svg viewBox="0 0 24 24"><path fill="#ffd166" d="M12 2l3 7h7l-5.6 4.3L18.5 21 12 16.6 5.5 21l2.1-7.7L2 9h7z"/></svg>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#06d6a0"/><path d="M7 12l3 3 7-7" stroke="#fff" stroke-width="2.5" fill="none"/></svg>
  </div>
  <div class="ball"></div>
  <div id="counter">0</div>
</div>
<script>
  // JavaScript-driven animation (requestAnimationFrame) and timers also work.
  var ball = document.querySelector('.ball');
  var start = performance.now();
  function tick(now) {
    var t = (now - start) / 1000;
    if (t > 3.5) t = 3.5;
    ball.style.transform = 'translateX(' + (t * 400) + 'px) translateY(' + (-Math.abs(Math.sin(t * 3)) * 200) + 'px)';
    if (t < 3.5) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  var n = 0;
  var iv = setInterval(function () {
    document.getElementById('counter').textContent = ++n;
    if (n === 3) clearInterval(iv);
  }, 1000);
</script>
</body>
</html>
